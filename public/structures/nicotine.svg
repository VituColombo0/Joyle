<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pyridine ring (6-membered with N) -->
  <path d="M15 20 L25 12 L40 15 L45 30 L35 42 L20 40 Z" />
  <!-- Double bonds in pyridine -->
  <path d="M18 22 L24 16" stroke-opacity="0.5" />
  <path d="M30 13 L38 17" stroke-opacity="0.5" />
  <path d="M43 25 L40 35" stroke-opacity="0.5" />
  <!-- Nitrogen in pyridine -->
  <circle cx="28" cy="28" r="2" fill="currentColor" stroke="none" />
  <!-- Pyrrolidine ring (5-membered) -->
  <path d="M55 15 L70 10 L80 22 L70 38 L55 35 Z" />
  <!-- Nitrogen in pyrrolidine -->
  <circle cx="65" cy="22" r="2" fill="currentColor" stroke="none" />
  <!-- Bridge connecting the rings -->
  <line x1="35" y1="30" x2="55" y2="25" />
  <!-- Methyl groups -->
  <line x1="70" y1="10" x2="75" y2="5" />
  <line x1="55" y1="35" x2="50" y2="42" />
</svg>