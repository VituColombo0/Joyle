<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Water molecule H2O -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <!-- Bonds to hydrogen -->
    <line x1="30" y1="25" x2="15" y2="45" stroke-opacity="0.5"/>
    <line x1="30" y1="25" x2="45" y2="45" stroke-opacity="0.5"/>
  </g>
  <!-- Oxygen atom (red) -->
  <circle cx="30" cy="25" r="10" fill="#FF6B6B" fill-opacity="0.7"/>
  <!-- Hydrogen atoms (white/gray) -->
  <circle cx="15" cy="45" r="6" fill="#E0E0E0" fill-opacity="0.8"/>
  <circle cx="45" cy="45" r="6" fill="#E0E0E0" fill-opacity="0.8"/>
</svg>