<svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Caffeine molecule - simplified structure -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- Six-membered ring (pyrimidine) -->
    <path d="M40 15 L70 15 L85 35 L70 55 L40 55 L25 35 Z" stroke-opacity="0.5"/>
    <!-- Five-membered ring (imidazole) fused -->
    <path d="M25 35 L10 45 L15 65 L40 55" stroke-opacity="0.5"/>
    <!-- Double bonds -->
    <path d="M40 15 L55 15" stroke-opacity="0.4"/>
    <path d="M70 15 L70 25" stroke-opacity="0.4"/>
    <path d="M85 35 L85 45" stroke-opacity="0.4"/>
    <path d="M70 55 L55 55" stroke-opacity="0.4"/>
    <path d="M40 55 L25 45" stroke-opacity="0.4"/>
  </g>
  <!-- Methyl groups -->
  <g fill="currentColor" fill-opacity="0.6">
    <!-- CH3 groups -->
    <circle cx="95" cy="20" r="6"/>
    <circle cx="95" cy="50" r="6"/>
    <circle cx="15" cy="75" r="6"/>
  </g>
  <!-- Atoms -->
  <g fill="currentColor" fill-opacity="0.8">
    <circle cx="40" cy="15" r="3"/>
    <circle cx="70" cy="15" r="3"/>
    <circle cx="85" cy="35" r="3"/>
    <circle cx="70" cy="55" r="3"/>
    <circle cx="40" cy="55" r="3"/>
    <circle cx="25" cy="35" r="3"/>
    <circle cx="10" cy="45" r="2.5"/>
    <circle cx="15" cy="65" r="2.5"/>
  </g>
  <!-- Nitrogen atoms (blue-ish) -->
  <g fill="#4FC3F7" fill-opacity="0.8">
    <circle cx="55" cy="35" r="3"/>
    <circle cx="55" cy="35" r="3"/>
  </g>
</svg>