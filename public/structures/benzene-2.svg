<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Benzene Ring - Alternative style with double bonds -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- Hexagon -->
    <path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" stroke-opacity="0.5"/>
    <!-- Double bonds (alternating) -->
    <path d="M50 10 L65 15" stroke-opacity="0.4"/>
    <path d="M90 30 L90 70" stroke-opacity="0.4"/>
    <path d="M50 90 L35 85" stroke-opacity="0.4"/>
    <path d="M10 70 L10 30" stroke-opacity="0.4"/>
    <path d="M10 30 L25 40" stroke-opacity="0.4"/>
    <path d="M50 90 L65 80" stroke-opacity="0.4"/>
  </g>
  <!-- Carbon atoms -->
  <g fill="currentColor" fill-opacity="0.7">
    <circle cx="50" cy="10" r="3"/>
    <circle cx="90" cy="30" r="3"/>
    <circle cx="90" cy="70" r="3"/>
    <circle cx="50" cy="90" r="3"/>
    <circle cx="10" cy="70" r="3"/>
    <circle cx="10" cy="30" r="3"/>
  </g>
</svg>