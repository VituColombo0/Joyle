<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Benzene with functional groups -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- Main ring -->
    <path d="M50 15 L80 32.5 L80 67.5 L50 85 L20 67.5 L20 32.5 Z" stroke-opacity="0.5"/>
    <!-- Inner circle -->
    <circle cx="50" cy="50" r="20" stroke-opacity="0.3"/>
  </g>
  <!-- Functional group: OH (hydroxyl) -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="80" y1="32.5" x2="95" y2="20" stroke-opacity="0.4"/>
  </g>
  <circle cx="95" cy="20" r="5" fill="#FF6B6B" fill-opacity="0.6"/>
  <!-- Functional group: CH3 (methyl) -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="80" y1="67.5" x2="95" y2="80" stroke-opacity="0.4"/>
  </g>
  <circle cx="95" cy="80" r="5" fill="#4CAF50" fill-opacity="0.6"/>
  <!-- Functional group: NH2 (amino) -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="20" y1="67.5" x2="5" y2="80" stroke-opacity="0.4"/>
  </g>
  <circle cx="5" cy="80" r="5" fill="#4FC3F7" fill-opacity="0.6"/>
  <!-- Carbon atoms -->
  <g fill="currentColor" fill-opacity="0.8">
    <circle cx="50" cy="15" r="3"/>
    <circle cx="80" cy="32.5" r="3"/>
    <circle cx="80" cy="67.5" r="3"/>
    <circle cx="50" cy="85" r="3"/>
    <circle cx="20" cy="67.5" r="3"/>
    <circle cx="20" cy="32.5" r="3"/>
  </g>
</svg>