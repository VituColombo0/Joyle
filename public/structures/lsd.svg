<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Indole ring (benzene fused with pyrrole) - left side -->
  <path d="M10 25 L22 18 L34 25 L34 42 L22 50 L10 42 Z" />
  <circle cx="18" cy="34" r="2" fill="currentColor" stroke="none" />
  <!-- Double bonds in indole benzene -->
  <path d="M13 27 L20 22" stroke-opacity="0.5" />
  <path d="M26 20 L31 25" stroke-opacity="0.5" />
  <!-- Bridge to second ring system -->
  <line x1="34" y1="33" x2="45" y2="28" />
  <!-- Second ring system -->
  <path d="M45 20 L60 15 L70 25 L65 40 L50 42 L45 30 Z" />
  <circle cx="55" cy="28" r="2" fill="currentColor" stroke="none" />
  <!-- Third ring (cyclohexadiene) -->
  <path d="M70 20 L85 15 L95 25 L90 40 L78 42 L70 30 Z" />
  <!-- Diethylamide chain -->
  <line x1="90" y1="28" x2="105" y2="25" />
  <line x1="105" y1="25" x2="115" y2="35" />
  <line x1="115" y1="35" x2="115" y2="45" />
  <line x1="115" y1="45" x2="125" y2="50" />
  <line x1="125" y1="50" x2="125" y2="60" />
  <!-- N in amide -->
  <circle cx="108" cy="32" r="1.5" fill="currentColor" stroke="none" />
  <text x="115" y="22" font-size="6" fill="currentColor" stroke="none">O</text>
  <!-- Diethyl groups -->
  <line x1="125" y1="60" x2="135" y2="65" />
  <line x1="125" y1="60" x2="130" y2="55" />
  <text x="130" y="70" font-size="5" fill="currentColor" stroke="none">CH₃</text>
  <text x="133" y="52" font-size="5" fill="currentColor" stroke="none">CH₃</text>
</svg>