<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fullerene C60 - simplified pentagon/hexagon structure -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- Outer ring -->
    <circle cx="50" cy="50" r="40" stroke-opacity="0.4"/>
    <!-- Middle ring -->
    <circle cx="50" cy="50" r="25" stroke-opacity="0.3"/>
    <!-- Inner structure -->
    <circle cx="50" cy="50" r="10" stroke-opacity="0.2"/>
    <!-- Connecting spokes -->
    <line x1="50" y1="10" x2="50" y2="20" stroke-opacity="0.3"/>
    <line x1="50" y1="80" x2="50" y2="90" stroke-opacity="0.3"/>
    <line x1="10" y1="50" x2="20" y2="50" stroke-opacity="0.3"/>
    <line x1="80" y1="50" x2="90" y2="50" stroke-opacity="0.3"/>
    <!-- Diagonal connections -->
    <line x1="21.7" y1="21.7" x2="29.4" y2="29.4" stroke-opacity="0.3"/>
    <line x1="78.3" y1="78.3" x2="70.6" y2="70.6" stroke-opacity="0.3"/>
    <line x1="21.7" y1="78.3" x2="29.4" y2="70.6" stroke-opacity="0.3"/>
    <line x1="78.3" y1="21.7" x2="70.6" y2="29.4" stroke-opacity="0.3"/>
  </g>
  <!-- Carbon atoms at vertices -->
  <g fill="currentColor" fill-opacity="0.6">
    <circle cx="50" cy="10" r="3"/>
    <circle cx="50" cy="90" r="3"/>
    <circle cx="10" cy="50" r="3"/>
    <circle cx="90" cy="50" r="3"/>
    <circle cx="21.7" cy="21.7" r="2.5"/>
    <circle cx="78.3" cy="78.3" r="2.5"/>
    <circle cx="21.7" cy="78.3" r="2.5"/>
    <circle cx="78.3" cy="21.7" r="2.5"/>
  </g>
</svg>