<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Indole ring system (benzene fused with pyrrole) -->
  <path d="M25 20 L35 15 L45 20 L45 35 L35 40 L25 35 Z" />
  <path d="M25 20 L25 35" />
  <path d="M35 40 L35 55" />
  <!-- Double bonds in benzene -->
  <path d="M27 23 L33 18" stroke-opacity="0.5" />
  <path d="M37 17 L43 22" stroke-opacity="0.5" />
  <path d="M43 28 L43 33" stroke-opacity="0.5" />
  <!-- N in the pyrrole ring -->
  <circle cx="30" cy="28" r="2" fill="currentColor" stroke="none" />
  <!-- Hydroxyl group on benzene -->
  <line x1="45" y1="20" x2="52" y2="15" />
  <text x="55" y="13" font-size="8" fill="currentColor" stroke="none">OH</text>
  <!-- Ethylamine chain -->
  <line x1="35" y1="40" x2="35" y2="50" />
  <line x1="35" y1="50" x2="45" y2="60" />
  <line x1="45" y1="60" x2="45" y2="68" />
  <text x="48" y="72" font-size="7" fill="currentColor" stroke="none">NH₂</text>
</svg>