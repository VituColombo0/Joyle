<svg width="180" height="60" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Polymer Chain - zigzag structure -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <!-- Main chain backbone -->
    <path d="M10 30 L30 15 L50 45 L70 15 L90 45 L110 15 L130 45 L150 15 L170 30" stroke-opacity="0.5"/>
  </g>
  <!-- Carbon atoms -->
  <g fill="currentColor" fill-opacity="0.7">
    <circle cx="10" cy="30" r="4"/>
    <circle cx="30" cy="15" r="4"/>
    <circle cx="50" cy="45" r="4"/>
    <circle cx="70" cy="15" r="4"/>
    <circle cx="90" cy="45" r="4"/>
    <circle cx="110" cy="15" r="4"/>
    <circle cx="130" cy="45" r="4"/>
    <circle cx="150" cy="15" r="4"/>
    <circle cx="170" cy="30" r="4"/>
  </g>
  <!-- Hydrogen atoms (small) -->
  <g fill="currentColor" fill-opacity="0.5">
    <circle cx="20" cy="22" r="2"/>
    <circle cx="40" cy="28" r="2"/>
    <circle cx="60" cy="28" r="2"/>
    <circle cx="80" cy="28" r="2"/>
    <circle cx="100" cy="28" r="2"/>
    <circle cx="120" cy="28" r="2"/>
    <circle cx="140" cy="28" r="2"/>
    <circle cx="160" cy="22" r="2"/>
  </g>
</svg>